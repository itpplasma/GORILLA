name: Repository hygiene
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@104634c01aa669d542e8a26a34a50b6471fc19ce
    with:
      hygiene-revision: 104634c01aa669d542e8a26a34a50b6471fc19ce
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
