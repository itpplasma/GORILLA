name: Ubuntu

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  Ubuntu-coverage:
    # Required validation runs after admission to the merge queue.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]

    env:
      FC: /usr/bin/gfortran
      PFUNIT_DIR: ${{ github.workspace }}/pFUnit/build/installed/PFUNIT-4.7/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libnetcdff-dev
          sudo apt-get install -y lcov

      - name: Install pFUnit
        run: |
          git clone --branch v4.7.0 https://github.com/Goddard-Fortran-Ecosystem/pFUnit
          cd pFUnit
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)
          make tests
          make install

      - name: Build
        run: |
          ./build_coverage.sh

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: BUILD/COVERAGE/

  Ubuntu:
    runs-on: [self-hosted, itp-ubuntu24]

    env:
      FC: /usr/bin/gfortran
      PFUNIT_DIR: ${{ github.workspace }}/pFUnit/build/installed/PFUNIT-4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libnetcdff-dev

      - name: Build
        run: |
          make

      - name: Check the nightly triage
        run: python3 ci/test_nightly_triage.py

      - name: Run examples
        run: |
          for i in 1 2 3 4 5 6 7; do
            (cd EXAMPLES/example_$i && ./test_gorilla_main.x)
          done

      # The MATLAB and Python examples (about 10 minutes) run nightly (nightly.yml).

    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
